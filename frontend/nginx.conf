# WindLens web tier: static SPA + same-origin reverse proxy for the API.
# The API itself sets its own cache, ETag and security headers; nginx only adds
# the headers that apply to the document and should never be duplicated there.

upstream windlens_api {
    server api:8000;
    keepalive 16;
}

# Cache-Control is attached at server level so the security headers below are
# inherited by every location. Empty values suppress the header entirely, which
# lets API responses keep the cache policy set by FastAPI.
map $uri $windlens_cache_control {
    default                                      "";
    =/                                           "no-cache, no-store, must-revalidate";
    =/index.html                                 "no-cache, no-store, must-revalidate";
    ~^/assets/                                   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Defence in depth for the static document. The API sets equivalent values
    # itself, so either deployment path (nginx or Vercel) has the same posture.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $windlens_cache_control always;

    location = /index.html {
        try_files $uri =404;
    }

    # Hashed Vite assets are content-addressed and safe to cache forever.
    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://windlens_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Client-side routes fall back to the SPA shell. Unknown files still 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
