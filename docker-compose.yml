name: windlens

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: windlens-api:local
    environment:
      DATA_DIR: /srv/data
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: windlens-web:local
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
