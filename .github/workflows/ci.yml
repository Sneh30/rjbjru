name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: mypy
        working-directory: backend
        run: python -m mypy --strict app/domain app/services app/data app/api
      - name: pytest with coverage gate
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run --coverage
      - run: npm run build

  contract:
    name: Contract · generated types + hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Install frontend tooling
        working-directory: frontend
        run: npm ci
      - name: Regenerate OpenAPI contract
        env:
          PYTHON: python
        run: make types
      - name: Generated contract is current
        run: git diff --exit-code -- frontend/src/types/openapi.d.ts
      - name: Placeholder scan
        run: bash scripts/check_no_placeholders.sh
      - name: Number consistency
        run: bash scripts/check_numbers_consistency.sh
      - name: Video timing estimate
        run: python3 scripts/check_video_timing.py

  docker:
    name: Docker · both images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build API image
        run: docker build -f backend/Dockerfile -t windlens-api:ci .
      - name: Build web image
        run: docker build -f frontend/Dockerfile -t windlens-web:ci .

  anonymity:
    name: Anonymity · text and commit metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generic anonymity checks
        run: bash scripts/check_anonymity.sh
